agent_card:
  name: Bot Hub
  description: >-
    Prediction market trading agent for Kalshi. Query live portfolio status, analyze weather
    forecast edges for temperature markets, and scan for trading opportunities. All access is
    read-only.
  version: 1.0.0
  url: https://baconhollow.com
  protocol_version: 0.3.0
  preferred_transport: JSONRPC
  provider: null
  documentation_url: null
  capabilities:
    streaming: false
    push_notifications: false
  default_input_modes: [text/plain]
  default_output_modes: [text/plain]
  security_schemes: null
  skill_count: 4
  skills:
  - id: portfolio-status
    name: Portfolio Status
    tags: [portfolio, balance, positions, pnl, trading]
  - id: weather-forecast-edge
    name: Weather Forecast Edge
    tags: [weather, forecast, temperature, edge, kalshi]
  - id: market-scan
    name: Market Scan
    tags: [scan, market, opportunities, kalshi]
  - id: oracle-picks
    name: Oracle Trading Picks
    tags: [oracle, picks, trading, weather, kalshi, catalog, signup]
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: 0.3.0
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: true
  grade_basis: >-
    Graded with the catalog's own grader (network/scripts/lib_agent_card.grade_agent_card):
    conformant, no computed deviations, no missing fields. capabilities is an OBJECT
    (pushNotifications, streaming); protocolVersion "0.3.0" is present at the top level;
    skills is an ARRAY of four, each carrying id, name, description, tags and examples;
    defaultInputModes, defaultOutputModes and preferredTransport are all declared. The
    endpoint the card names was exercised live (message/send, tasks/get) and answered with
    agent-specific content, so the card describes a callable agent, not a placeholder.
  deviations:
  - field: provider / documentationUrl
    observed: absent
    note: >-
      Both optional, but their absence plus a host that serves no HTML means an agent (or a human)
      reading this card has no way to learn who operates Bot Hub, where its documentation lives,
      or how to contact anyone. The registry lists author "Unknown".
  - field: securitySchemes / security
    observed: absent
    note: >-
      Accurate for the surface probed — message/send answered anonymously. The oracle-picks skill
      describes "tier-based access" and "sign up for a buyer account", so an authorization layer
      exists behind the conversational surface, but the card declares no scheme for it.
  - field: skills[].inputModes / outputModes
    observed: absent on every skill
    note: Optional; the top-level text/plain defaults apply.
  - field: method table
    observed: 0.3.0 names only
    note: >-
      message/send and tasks/get are implemented; the 1.0 names (SendMessage) return -32601. A
      1.0-only client cannot talk to it, which is coherent with protocolVersion 0.3.0.
  - field: signatures
    observed: absent
    note: No JWS signature block; authenticity rests on TLS to baconhollow.com (Let's Encrypt).
subject:
  about: the-api
  basis: >-
    The card's url is the host that serves the card and the host that answers the JSON-RPC
    methods; there is no documentation site for it to describe instead. Not a
    documentation-platform card.
surface_relationship:
  note: >-
    A2A is the ONLY published machine surface. No OpenAPI, GraphQL, MCP (tools/list -> Method
    not found), llms.txt, robots.txt, sitemap, packages or web pages were found on the host, on
    npm, PyPI or GitHub. The four skills are the whole advertised capability set; what lies
    behind them (Kalshi account access, GFS forecast model, the Weather Oracle strategy catalog
    and its buyer tiers) is reachable only by conversing with the agent.
